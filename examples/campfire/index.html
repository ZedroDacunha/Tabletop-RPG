<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório da fogueira • Tabletop RPG</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a16;color:#ebeee0;font:15px system-ui}canvas{width:100vw;height:100vh;display:block}aside{position:fixed;top:20px;left:20px;width:300px;max-width:calc(100vw - 40px);padding:24px;border:1px solid #53614b;border-radius:16px;background:#16251eee;box-shadow:0 16px 50px #0005}a{color:#c4dc9c}h1{font-size:24px;margin:14px 0 8px}p{color:#b9c6b4;line-height:1.5}label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}select{padding:7px;background:#283a2e;color:#fff;border:1px solid #607052;border-radius:6px}input{accent-color:#e8a555;max-width:150px}output{display:block;border-top:1px solid #506045;padding-top:16px;line-height:1.6;color:#e2c193;font-variant-numeric:tabular-nums}#message{position:fixed;bottom:20px;left:20px;right:20px;background:#24342b;padding:14px;border-radius:10px}#message:empty{display:none}@media(max-width:600px){aside{top:10px;left:10px;width:270px;padding:16px}h1{font-size:20px}label{margin:12px 0}}
</style></head><body><canvas id="view" aria-label="Cena 3D de teste das fogueiras"></canvas><aside><a href="../../">← Voltar ao mapa</a><h1>Laboratório da fogueira</h1><p>Arraste para orbitar. Use a roda para aproximar. Compare câmeras e quantidade de fogueiras.</p><label>Fogueiras <select id="count"><option>1</option><option selected>5</option><option>20</option></select></label><label>Intensidade <input id="intensity" type="range" min="0" max="2" step="0.05" value="1"></label><label>Fumaça sutil <input id="smoke" type="checkbox" checked></label><label>Câmera <select id="camera"><option value="perspective">Órbita livre</option><option value="top">Vista de cima</option><option value="ortho">Ortográfica</option></select></label><output id="metrics" aria-live="off">Preparando a cena…</output></aside><div id="message" role="status"></div><script type="module" src="./main.ts"></script></body></html>
