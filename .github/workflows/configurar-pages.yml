name: Configurar Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar a fonte do Pages para GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "## Configuração do Pages $(date -u +%H:%M:%SZ)"
            echo
            echo '### Antes'
            echo '```json'
            gh api "repos/$GITHUB_REPOSITORY/pages" || true
            echo '```'
            echo '### Alterando'
            echo '```'
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow || true
            echo '```'
            echo '### Depois'
            echo '```json'
            gh api "repos/$GITHUB_REPOSITORY/pages" || true
            echo '```'
          } > /tmp/resumo.md
          cat /tmp/resumo.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Configuração do Pages (temporário)" --body-file /tmp/resumo.md
