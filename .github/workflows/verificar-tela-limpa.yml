name: Verificar tela limpa

on:
  push:
    branches: [arena/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save puppeteer-core
      - run: node scripts/verificar-tela-limpa.mjs
      - if: always()
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r capturas/. /tmp/pub/
          cd /tmp/pub
          git init -q && git checkout -q -b capturas-ci
          git add -A
          git -c user.name=capturas -c user.email=capturas@users.noreply.github.com commit -qm "capturas: medicao"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" capturas-ci
