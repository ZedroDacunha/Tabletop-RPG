name: Verificar site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Instalar Puppeteer
        run: npm i --no-save puppeteer-core@23

      - name: Descobrir o Chrome
        run: |
          which google-chrome || which google-chrome-stable || which chromium || true

      - name: Testar build local e site publicado
        run: |
          mkdir -p out
          python3 -m http.server 8000 --directory dist &
          sleep 2
          curl -s -o out/local.html -w 'local %{http_code}\n' http://127.0.0.1:8000/
          curl -s -o out/live.html -w 'live %{http_code}\n' https://zedrodacunha.github.io/Tabletop-RPG/ || true
          head -c 800 out/live.html || true
          node scripts/verificar.mjs
          cat out/relatorio.txt

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao
          path: out
