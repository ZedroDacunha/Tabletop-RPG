name: Verificar site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Instalar Puppeteer
        run: npm i --no-save puppeteer-core@23

      - name: Preparar Chrome e servidor
        run: |
          mkdir -p out
          python3 -m http.server 8000 --directory dist &
          sleep 2
          curl -s -o /dev/null -w 'servidor local: %{http_code}\n' http://127.0.0.1:8000/

      - name: Capturar telas
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "chrome: $CHROME_PATH"
          node scripts/verificar.mjs
          cat out/relatorio.txt

      - name: Publicar capturas em issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f out/relatorio.txt ]; then node scripts/publicar-capturas.mjs; fi

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao
          path: out
