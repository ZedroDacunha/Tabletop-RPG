name: Limpar verificação

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Fechar as issues temporárias de verificação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq '.[] | select(.title | test("^(CAPTURA|RELATORIO|Diagnóstico|Configuração do Pages)")) | .number' \
            | while read -r n; do gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" || true; done
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 20
