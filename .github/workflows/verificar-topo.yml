name: Verificar menu do topo

on:
  push:
    branches: [arena/354a1134-tabletop-rpg]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o site
        run: npm run build

      - name: Instalar o puppeteer-core
        run: npm install --no-save puppeteer-core

      - name: Verificar o topo no navegador
        id: verificar
        continue-on-error: true
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/verificar-topo.mjs

      - name: Publicar as capturas
        if: always()
        run: |
          git config user.name "verificacao"
          git config user.email "verificacao@users.noreply.github.com"
          git checkout -B capturas-ci
          git add -f capturas
          git commit -m "Capturas: menu do topo" || echo "sem mudanças"
          git push -f origin capturas-ci

      - name: Repassar o resultado da verificação
        if: steps.verificar.outcome == 'failure'
        run: exit 1
