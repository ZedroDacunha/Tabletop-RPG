name: Verificar teclado

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save puppeteer-core@23
      - name: Servir o build
        run: |
          mkdir -p out /tmp/serve
          ln -sfn "$PWD/dist" /tmp/serve/Tabletop-RPG
          python3 -m http.server 8000 --directory /tmp/serve > /tmp/serve.log 2>&1 &
          sleep 3
      - name: Testar atalhos
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export SITE_URL="http://127.0.0.1:8000/Tabletop-RPG/"
          node scripts/verificar.mjs
      - name: Publicar relatório em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f out/relatorio-site.txt ]; then node scripts/publicar-capturas.mjs; fi
