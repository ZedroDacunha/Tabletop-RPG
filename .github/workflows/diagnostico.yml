name: Diagnóstico da publicação

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Ver o que o site publicado está entregando
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "## Diagnóstico $(date -u +%H:%M:%SZ)"
            echo
            echo '```'
            curl -sS -o /tmp/site.html -w 'HTTP %{http_code}\n' https://zedrodacunha.github.io/Tabletop-RPG/
            echo '```'
            echo '**HTML entregue:**'
            echo '```html'
            head -c 1200 /tmp/site.html
            echo
            echo '```'
            echo '**Referências:**'
            echo '```'
            grep -oE '(src|href)="[^"]+"' /tmp/site.html
            echo '```'
          } > /tmp/resumo.md
          cat /tmp/resumo.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Diagnóstico da publicação (temporário)" --body-file /tmp/resumo.md
