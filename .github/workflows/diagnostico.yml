name: Diagnóstico da publicação

on:
  push:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Ver o que o site publicado está entregando
        run: |
          echo "== HTTP =="
          curl -sS -o /tmp/site.html -D - https://zedrodacunha.github.io/Tabletop-RPG/ | head -15
          echo "== HTML (primeiras linhas) =="
          head -c 1500 /tmp/site.html
          echo
          echo "== Arquivos referenciados =="
          grep -oE '(src|href)="[^"]+"' /tmp/site.html || true
