name: Publicar site

# Sempre que a branch main receber mudanças, o site é recompilado e publicado
# automaticamente em https://zedrodacunha.github.io/Tabletop-RPG/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Compilar o site
        run: npm run build

      - name: Adicionar fallback de página única
        run: cp dist/index.html dist/404.html

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
