<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Harness da tenda</title>
<style>html,body{margin:0;background:#1b2420}canvas{display:block}</style></head>
<body>
<script type="module">
import * as T from 'three';
import {buildTentModel} from '/src/scene/tentModel.ts';

const modelo = buildTentModel();
const cena = new T.Scene();
cena.background = new T.Color('#202b26');

// chão de referência, com a mesma escala de metro do editor
const chao = new T.Mesh(new T.CircleGeometry(9, 48), new T.MeshStandardMaterial({color:'#3c4a3c', roughness:1}));
chao.rotation.x = -Math.PI / 2;
chao.receiveShadow = true;
cena.add(chao);

for (const [x, z] of [[3, 1], [-3, -1]]) {
  const pedra = new T.Mesh(new T.IcosahedronGeometry(.35, 0), new T.MeshStandardMaterial({color:'#8b968c', flatShading:true}));
  pedra.position.set(x, .2, z);
  cena.add(pedra);
}
// uma árvore simples só como escala
const tronco = new T.Mesh(new T.CylinderGeometry(.12, .18, 1.6, 8), new T.MeshStandardMaterial({color:'#6b543c'}));
tronco.position.set(-2.6, .8, 2.2);
cena.add(tronco);
const copa = new T.Mesh(new T.IcosahedronGeometry(1.1, 1), new T.MeshStandardMaterial({color:'#4f6d4a', flatShading:true}));
copa.position.set(-2.6, 2.2, 2.2);
cena.add(copa);

cena.add(new T.HemisphereLight('#dfead1', '#3a4436', 1.15));
const sol = new T.DirectionalLight('#fff2d6', 2.1);
sol.position.set(5, 9, 6);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
sol.shadow.camera.left = -8; sol.shadow.camera.right = 8; sol.shadow.camera.top = 8; sol.shadow.camera.bottom = -8;
cena.add(sol);
cena.add(modelo);

const largura = 1280, altura = 900;
const render = new T.WebGLRenderer({antialias:true});
render.setSize(largura, altura);
render.shadowMap.enabled = true;
render.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(render.domElement);

const angulos = [
  {nome:'frente-direita', azimute: 38, elevacao: 20, dist: 6.4},
  {nome:'frente', azimute: 0, elevacao: 8, dist: 5.6},
  {nome:'lateral-esquerda', azimute: -104, elevacao: 16, dist: 6.2},
  {nome:'fundos', azimute: 168, elevacao: 26, dist: 6.4},
];
const camera = new T.PerspectiveCamera(38, (largura/2)/(altura/2), .1, 100);
render.setScissorTest(true);
angulos.forEach((a, i) => {
  const rad = a.azimute * Math.PI / 180, el = a.elevacao * Math.PI / 180;
  camera.position.set(Math.sin(rad) * Math.cos(el) * a.dist, 1.05 + Math.sin(el) * a.dist, Math.cos(rad) * Math.cos(el) * a.dist);
  camera.lookAt(0, 1.02, 0);
  const x = (i % 2) * largura / 2, y = (1 - Math.floor(i / 2)) * altura / 2;
  render.setViewport(x, y, largura / 2, altura / 2);
  render.setScissor(x, y, largura / 2, altura / 2);
  render.render(cena, camera);
});
window.__pronto = true;
</script>
</body>
</html>
